[Service]
# Ollama systemd override for Arch Linux workstation (AMD RX 6750 XT 12 GB VRAM)
# Install at: /etc/systemd/system/ollama.service.d/override.conf
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_MODELS=/data/ollama/models"

# Lower CPU/I/O priority to prevent Hyprland/Wayland compositor freezes during inference
Nice=15
CPUSchedulingPolicy=batch
IOSchedulingClass=idle

# Restrict concurrent model loading to protect VRAM and desktop responsiveness
Environment="OLLAMA_MAX_LOADED_MODELS=1"
